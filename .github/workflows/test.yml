name: test the command
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get the command
        uses: actions/checkout@v3
      - name: install the node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: install the dependencies
        run: npm ci
      - name : test the npm
        run: npm test
  test2:
    runs-on: ubuntu-latest
    steps:
      - name: get the command
        uses: actions/checkout@v3
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: get the command
        uses: actions/checkout@v3
      - name: install the node 
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: |
          npm ci
          npm test
      - name: build the project
        run: npm run build 
      - name : deploy the application
        run: echo "Deploying and deployed"